<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Niche</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9f9f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p.sub {
      color: #666;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .niches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      max-width: 640px;
      width: 100%;
    }

    .niche {
      background: #fff;
      border: 1.5px solid #e5e5e5;
      border-radius: 12px;
      padding: 1.4rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      user-select: none;
    }

    .niche:hover {
      border-color: #1a1a1a;
    }

    .niche.selected {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 3px rgba(26,26,26,0.08);
    }

    .niche .icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .niche .label { font-size: 0.9rem; font-weight: 500; }

    button {
      margin-top: 2rem;
      padding: 0.85rem 2.5rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      opacity: 0.3;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    button.active {
      opacity: 1;
      pointer-events: all;
    }

    button.active:hover { transform: translateY(-1px); }
    button.active:active { transform: translateY(0); }
  </style>
</head>
<body>

  <h1>What's your niche?</h1>
  <p class="sub">Pick one to get started.</p>

  <div class="niches">
    <div class="niche" data-niche="fitness">
      <div class="icon">💪</div>
      <div class="label">Fitness</div>
    </div>
    <div class="niche" data-niche="finance">
      <div class="icon">💰</div>
      <div class="label">Finance</div>
    </div>
    <div class="niche" data-niche="coaching">
      <div class="icon">🎯</div>
      <div class="label">Coaching</div>
    </div>
    <div class="niche" data-niche="ecommerce">
      <div class="icon">🛍️</div>
      <div class="label">E-commerce</div>
    </div>
    <div class="niche" data-niche="content">
      <div class="icon">✍️</div>
      <div class="label">Content</div>
    </div>
    <div class="niche" data-niche="saas">
      <div class="icon">🚀</div>
      <div class="label">SaaS</div>
    </div>
    <div class="niche" data-niche="realestate">
      <div class="icon">🏠</div>
      <div class="label">Real Estate</div>
    </div>
    <div class="niche" data-niche="other">
      <div class="icon">✨</div>
      <div class="label">Other</div>
    </div>
  </div>

  <button id="cta">Continue →</button>

  <script>
    const niches = document.querySelectorAll('.niche');
    const btn = document.getElementById('cta');
    let selected = null;

    niches.forEach(n => {
      n.addEventListener('click', () => {
        niches.forEach(x => x.classList.remove('selected'));
        n.classList.add('selected');
        selected = n.dataset.niche;
        btn.classList.add('active');
      });
    });
  </script>

</body>
</html>
